<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <style>
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        background: transparent;
        overflow: hidden;
        -webkit-app-region: drag;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
      }
      img {
        width: 440px;
        height: 440px;
        object-fit: contain;
        user-select: none;
        pointer-events: none;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <img src="logo.png" alt="Fluxagram" />
  </body>
</html>
